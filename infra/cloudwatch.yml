AWSTemplateFormatVersion: "2010-09-09"
Description: FIApp production monitoring — metric filters, alarms, and CloudWatch dashboard

Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive error alerts

Resources:

  # ── Alerts ──────────────────────────────────────────────────────────────────

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: fiapp-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ── Metric Filters ──────────────────────────────────────────────────────────
  # Each filter scans the Amplify log group and counts matching lines as a
  # custom CloudWatch metric under the "FIApp" namespace.

  APIErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/amplify/d3nyg9qvz1tj5n
      FilterPattern: '"[withAuth] handler error"'
      MetricTransformations:
        - MetricName: APIErrors
          MetricNamespace: FIApp
          MetricValue: "1"
          DefaultValue: 0

  AllErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/amplify/d3nyg9qvz1tj5n
      FilterPattern: "ERROR"
      MetricTransformations:
        - MetricName: AllErrors
          MetricNamespace: FIApp
          MetricValue: "1"
          DefaultValue: 0

  AuthErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/amplify/d3nyg9qvz1tj5n
      FilterPattern: '"UNAUTHORIZED" OR "NoSignedUser"'
      MetricTransformations:
        - MetricName: AuthErrors
          MetricNamespace: FIApp
          MetricValue: "1"
          DefaultValue: 0

  # ── Alarms ──────────────────────────────────────────────────────────────────

  APIErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fiapp-api-errors-high
      AlarmDescription: "FIApp: more than 5 API handler errors in 5 minutes"
      MetricName: APIErrors
      Namespace: FIApp
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ── Dashboard ───────────────────────────────────────────────────────────────

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: FIApp-Production
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "alarm",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "title": "Alarm Status",
                "alarms": [
                  "arn:aws:cloudwatch:ap-southeast-2:${AWS::AccountId}:alarm:fiapp-api-errors-high"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "API Errors (5-min)",
                "metrics": [["FIApp", "APIErrors"]],
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "region": "ap-southeast-2"
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Auth Errors (5-min)",
                "metrics": [["FIApp", "AuthErrors"]],
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "region": "ap-southeast-2"
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "All Errors (5-min)",
                "metrics": [["FIApp", "AllErrors"]],
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "region": "ap-southeast-2"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 8, "width": 24, "height": 8,
              "properties": {
                "title": "Recent API Errors",
                "query": "SOURCE '/aws/amplify/d3nyg9qvz1tj5n' | fields @timestamp, @message | filter @message like /withAuth/ | sort @timestamp desc | limit 25",
                "region": "ap-southeast-2",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 16, "width": 24, "height": 8,
              "properties": {
                "title": "Recent Auth Errors",
                "query": "SOURCE '/aws/amplify/d3nyg9qvz1tj5n' | fields @timestamp, @message | filter @message like /UNAUTHORIZED/ or @message like /NoSignedUser/ | sort @timestamp desc | limit 25",
                "region": "ap-southeast-2",
                "view": "table"
              }
            }
          ]
        }
